<svg xmlns="http://www.w3.org/2000/svg" width="980" height="392" viewBox="0 0 980 392" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif" role="img" aria-labelledby="t d"><title id="t">Attack success with no defense, by retrieval setup and LLM</title><desc id="d">Heatmap of robust attack success rate for 3 retrieval setups by 3 LLMs, between 0.70 and 0.99, plus the share of the top-5 retrieved passages that are poison: 4.79, 4.53 and 4.62 of 5.</desc><rect width="980" height="392" fill="#0d1117"/><text x="24.0" y="36.0" font-size="20" fill="#e6edf3" text-anchor="start" font-weight="700">No defense: the attack survives a modern RAG stack</text><text x="24.0" y="60.0" font-size="13" fill="#b1bac4" text-anchor="start" font-weight="400">Attack success rate (robust metric), NQ, 100 target questions per cell, 5 poison texts in a 2.68M-passage corpus</text><text x="325.0" y="86.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">Vicuna-7B v1.3</text><text x="325.0" y="102.0" font-size="11.5" fill="#8b949e" text-anchor="middle" font-weight="400">2023, paper&#x27;s LLM</text><text x="479.0" y="86.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">Qwen3.5-27B</text><text x="479.0" y="102.0" font-size="11.5" fill="#8b949e" text-anchor="middle" font-weight="400">reasoning, dense</text><text x="633.0" y="86.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">gpt-oss-120b</text><text x="633.0" y="102.0" font-size="11.5" fill="#8b949e" text-anchor="middle" font-weight="400">reasoning, MoE</text><text x="828.0" y="86.0" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">Poison in the top-5</text><text x="828.0" y="102.0" font-size="11.5" fill="#8b949e" text-anchor="middle" font-weight="400">retrieved slots (same for all LLMs)</text><text x="234.0" y="144.0" font-size="14" fill="#e6edf3" text-anchor="end" font-weight="700">Contriever</text><text x="234.0" y="161.0" font-size="11.5" fill="#8b949e" text-anchor="end" font-weight="400">paper&#x27;s retriever</text><rect x="250" y="112" width="150" height="68" rx="4" fill="#6da7ec"/><text x="325.0" y="148.0" font-size="24" font-weight="700" fill="#0d1117" text-anchor="middle">0.89</text><rect x="404" y="112" width="150" height="68" rx="4" fill="#9ec5f4"/><text x="479.0" y="148.0" font-size="24" font-weight="700" fill="#0d1117" text-anchor="middle">0.99</text><text x="479.0" y="167.0" font-size="11.5" fill="#0d1117" text-anchor="middle" opacity="0.85">exact metric 0.79</text><rect x="558" y="112" width="150" height="68" rx="4" fill="#6da7ec"/><text x="633.0" y="148.0" font-size="24" font-weight="700" fill="#0d1117" text-anchor="middle">0.89</text><text x="633.0" y="167.0" font-size="11.5" fill="#0d1117" text-anchor="middle" opacity="0.85">exact metric 0.51</text><rect x="746" y="126" width="30" height="30" rx="4" fill="#262c35"/><rect x="746" y="126" width="30.0" height="30" rx="4" fill="#d95926"/><rect x="780" y="126" width="30" height="30" rx="4" fill="#262c35"/><rect x="780" y="126" width="30.0" height="30" rx="4" fill="#d95926"/><rect x="814" y="126" width="30" height="30" rx="4" fill="#262c35"/><rect x="814" y="126" width="30.0" height="30" rx="4" fill="#d95926"/><rect x="848" y="126" width="30" height="30" rx="4" fill="#262c35"/><rect x="848" y="126" width="30.0" height="30" rx="4" fill="#d95926"/><rect x="882" y="126" width="30" height="30" rx="4" fill="#262c35"/><rect x="882" y="126" width="23.7" height="30" rx="4" fill="#d95926"/><text x="828.0" y="174.0" font-size="12" fill="#b1bac4" text-anchor="middle" font-weight="400">4.79 of 5 are poison</text><text x="234.0" y="216.0" font-size="14" fill="#e6edf3" text-anchor="end" font-weight="700">Qwen3-Embedding-8B</text><text x="234.0" y="233.0" font-size="11.5" fill="#8b949e" text-anchor="end" font-weight="400">modern dense</text><rect x="250" y="184" width="150" height="68" rx="4" fill="#3987e5"/><text x="325.0" y="220.0" font-si